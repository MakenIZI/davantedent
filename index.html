<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/davantedent-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet"/>
    <title>DavanteDent ~ Gestión de citas</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/cita.js" defer></script>
    <script src="js/almacenamiento.js" defer></script>
    <script src="js/validacion.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <header>
    <img src="img/davantedent-logo.png" alt="Logotipo de DavanteDent" width="64">
    <h1 class="logo">Davante<span>Dent</span></h1>
    <h2>Te devolvemos tu sonrisa</h2>
    </header>

    <main>
        <section>
            <form id="formCita" novalidate
                  onsubmit="return guardarSiEsValido()"
                  oninput="limpiarError(event.target.id)">

                <input type="hidden" id="citaId">

                <fieldset>
                    <legend>Fecha de la cita</legend>

                    <div class="campo">
                        <label for="dia">Día: </label>
                        <input type="number" id="dia" name="dia" min="1" max="31">
                        <span class="mensaje-error" id="error-dia"></span>
                    </div>

                    <div class="campo">
                        <label for="mes">Mes: </label>
                        <select id="mes" name="mes">
                            <option value="">Elige un mes</option>
                            <option value="1">Enero</option>
                            <option value="2">Febrero</option>
                            <option value="3">Marzo</option>
                            <option value="4">Abril</option>
                            <option value="5">Mayo</option>
                            <option value="6">Junio</option>
                            <option value="7">Julio</option>
                            <option value="8">Agosto</option>
                            <option value="9">Septiembre</option>
                            <option value="10">Octubre</option>
                            <option value="11">Noviembre</option>
                            <option value="12">Diciembre</option>
                        </select>
                        <span class="mensaje-error" id="error-mes"></span>
                    </div>

                    <div class="campo">
                        <label for="anyo">Año: </label>
                        <input type="number" id="anyo" name="anyo" min="2026" max="2027">
                        <span class="mensaje-error" id="error-anyo"></span>
                    </div>

                    <div class="campo">
                        <label for="hora">Hora: </label>
                        <input type="number" id="hora" name="hora" min="8" max="20">
                        <span class="mensaje-error" id="error-hora"></span>
                    </div>

                    <div class="campo">
                        <label for="minuto">Minuto: </label>
                        <input type="number" id="minuto" name="minuto" min="0" max="59">
                        <span class="mensaje-error" id="error-minuto"></span>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Datos del paciente</legend>

                    <div class="campo">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre">
                        <span class="mensaje-error" id="error-nombre"></span>
                    </div>

                    <div class="campo">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" name="apellidos">
                        <span class="mensaje-error" id="error-apellidos"></span>
                    </div>

                    <div class="campo">
                        <label for="dni">DNI</label>
                        <input type="text" id="dni" name="dni" placeholder="12345678A">
                        <span class="mensaje-error" id="error-dni"></span>
                    </div>

                    <div class="campo">
                        <label for="telefono">Teléfono </label >
                        <input type="text" id="telefono" name="telefono" placeholder="918886677">
                        <span class="mensaje-error" id="error-telefono"></span>
                    </div>

                    <div class="campo">
                        <label for="fechaNacimiento">F. de nacimiento</label>
                        <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                        <span class="mensaje-error" id="error-fechaNacimiento"></span>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Observaciones</legend>

                    <div class="campo">
                        <label for="observaciones"></label>
                        <textarea id="observaciones" name="Observaciones" rows="3" maxlength="200" placeholder="Alguna alergia, enfermedad, etc."></textarea>  
                        <span class="mensaje-error" id="error-observaciones"></span>
                    </div>
                </fieldset>

                <button type="submit" id="btnGuardar">Guardar cita</button>
                <button type="button" id="btnCancelar" onclick="cancelarEdicion()">Cancelar</button>
            </form>
        </section>

        <section>
            <table id="tablaCitas">
            <thead>
            <tr>
            <th>Orden</th><th>Fecha</th><th>Hora</th>
            <th>Nombre</th><th>Apellidos</th><th>DNI</th><th>Teléfono</th>
            <th>F. Nacimiento</th><th>Observaciones</th><th>Acciones</th>
            </tr>
            </thead>
            <tbody id="cuerpoTabla"></tbody>
            </table>
        </section>
    </main>
    <footer>Avenida los caracoles nº 12, 28000 Madrid ~ Teléfono: 91 123 45 67 ~ Email: davantedent@yahoo.es

    </footer>
</body>
</html>
